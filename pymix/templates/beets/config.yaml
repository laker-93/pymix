# no `web` plugin: pymix talks to beets via `docker exec` CLI calls instead of
# its HTTP API, since running a Flask server per user is too memory-heavy for
# the resource-limited DO droplet.
# musicbrainz: the only metadata-source plugin loaded, so the autotagger has
# candidates at all (beets >= 2.3 moved MusicBrainz out of core). Interactive
# imports stay fast because they run with -A (--noautotag); this only matters
# for the background automatch sweep (epic #72) and manual -L reimports.
# no `subsonicupdate` plugin: pymix triggers the post-import Navidrome scan itself
# (SubsonicOrchestrator.scan, called from create_subsonic_playlists_from_xml), so the
# plugin's scan was redundant — and it was also broken, pointing at a URL with an
# extra path segment that Navidrome doesn't serve, so every beets command that wrote
# to the DB logged `subsonic: Error: Expecting value: line 1 column 1 (char 0)`
# (#60, #63). If it's ever re-enabled, note the URL is `http://<host>:4533` with no
# suffix — see `containers.subsonic.host` in config.prod.yaml.
# no `lastgenre` plugin: it was loaded with its config block commented out, so it ran
# on the plugin's defaults -- `auto: yes`, `force: yes`, `whitelist: yes`,
# `fallback: none`. That combination overwrites the genre on every import and sets it to
# None whenever the track's real genre is not one of the 1541 entries in beets' bundled
# genres.txt. A prod user's `BASS HOUSE` is not in that list, and neither is most of the
# vocabulary DJs use (the list has nine other house subgenres but not that one). Nothing
# in pymix wants beets to *guess* a genre -- the genre subbox wants is the one the DJ
# set, which is exactly what this overwrote (#179, and #180 for how it reached the file).
# If it is ever wanted back it needs at least `auto: no`.
plugins: fetchart lyrics embedart duplicates info musicbrainz
directory: /music
library: /config/musiclibrary.blb
art_filename: albumart
threaded: no
original_date: no
per_disc_numbering: no

  #convert:
  #    auto: no
  #    ffmpeg: /usr/bin/ffmpeg
  #    opts: -ab 320k -ac 2 -ar 48000
  #    max_bitrate: 320
  #    threads: 1
    
match:
  # want to accept a match automatically if it is greater than
  # 80%.
  # in order to do that must make beets ignore certain
  # attributes to prevent it downgrading from a strong rec and
  # therefore not accepting a match in quiet mode.
  max_rec:
    missing_tracks: strong
    unmatched_tracks: strong
  ignored: missing_tracks
  strong_rec_thresh: 0.20
  # don't mind if tracks are missing from an album
  distance_weights:
    missing_tracks: 0

paths:
    # for tracks without albumartist, fallback to unknown folder
    default: %if{$albumartist,$albumartist,_unknown}/%if{$album,$album,_unknown}/$track - %if{$artist,$artist,_unknown} - %if{$title,$title,_unknown}
    singleton: Non-Album/$track - $artist - $title
    comp: Compilations/$album/$track - $artist - $title
    albumtype_soundtrack: Soundtracks/$album/$track - $artist - $title 
        
import:
    write: yes
    copy: no
    # move so successfully imported files are moved out of the incoming staging directory for beets
    # then on partial import, can retry and attempt to complete the rest
    move: yes
    resume: ask
    incremental: no
    incremental_skip_later: no
    # keep and defer to the duplicates plugin for resolving
    duplicate_action: keep
    quiet_fallback: asis
    timid: no
    log: /config/beet.log

embedart:
    auto: yes
    remove_art_file: yes

fetchart:
    auto: yes
    
replaygain:
    auto: no

replace:
    '^\.': _
    '[\x00-\x1f]': _
    '[\xE8-\xEB]': e
    '[\xEC-\xEF]': i
    '[\xE2-\xE6]': a
    '[\xF2-\xF6]': o
    '[\xF8]': o
    #'\.$': _
    '\s+$': ''

lyrics:
    auto: no

duplicates:
    keys:
        - mb_trackid
        - mb_albumid
        - title
        - album
    tag: dup=1
