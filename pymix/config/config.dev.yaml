---
app_env: dev
local_user_music_stem: music
zip_name: music
rekordbox:
  xml_path: /subbox/rekordbox/rekordbox_empty.xml
containers:
  subsonic:
    host: http://host.docker.internal:{port}
    version: 1.16.1
    music_path_base_to_remove: /music/private
    serving_music_path_base: /private-music
    docker_compose_file: /subbox/docker-compose/navidrome/docker-compose.yml
    env_file: /subbox/docker-compose/navidrome/env
    config_file_dst: /subbox/private/{user}/navidrome/data/navidrome.toml
    metrics_path: /metrics
  filebrowser:
    user_root: /user-updownloads
    data_watch: /user-updownloads/{user}/watch
    data_uploads: /user-updownloads/{user}/uploads
    data_downloads: /user-updownloads/{user}/downloads
    docker_compose_file: /subbox/docker-compose/filebrowser/docker-compose.yml
    env_file: /subbox/docker-compose/filebrowser/env
  beets:
    data: /private-staged/{user}/
    data_public: /public-staged
    docker_compose_file: /subbox/docker-compose/beets/docker-compose.yml
    env_file: /subbox/docker-compose/beets/env
    config_file_dst: /subbox/private/{user}/beets/config/config.yaml
logs_directory: logs
user_root: /subbox/{user}
db:
  host: pymix-postgres
  port: 5432
max_number_of_users: 10
max_number_of_tracks: 1000
max_library_size: 10737418240 # 10GB
# number of seconds after which the export job will be updated with number of files written to zip during export job
update_job_period_s: 1
google_sheets:
  credentials_path: /subbox/secrets/google-sheets-service-account.json
  poll_interval_s: 300
  # hard cap on any single blocking Sheets HTTP call. Without it httplib2 blocks
  # forever on a half-open socket (laker-93/pymix#81).
  timeout_s: 30
wishlist:
  # how often the background loop re-checks open wishlist items against each
  # user's Navidrome library (catches tracks that only become queryable after
  # Navidrome finishes scanning a fresh import)
  reconcile_interval_s: 90
  # how often the background loop resolves pending free-text items (hand-typed
  # artist/title, or inbox raw notes) to a canonical MusicBrainz match, so a typo'd
  # entry is corrected before the downloader searches Soulseek for it. MusicBrainz
  # is rate-limited to ~1 req/s, so this is deliberately unhurried.
  resolve_interval_s: 60
  # Local dev runs from a residential IP that YouTube doesn't bot-challenge, so no
  # cookies are needed. Uncomment (and drop a cookies.txt at the path) only to
  # reproduce the prod cookie flow. See config.prod.yaml for details.
  # ytdlp_cookies_path: /subbox/secrets/ytdlp-cookies.txt
automatch:
  # opt-in allowlist of usernames the sweep may touch (see config.prod.yaml for
  # why it isn't just "every user"). '*' = every provisioned user, which is fine
  # locally where every container is disposable and freshly provisioned from the
  # current template.
  enabled_users:
    - '*'
  # how often the background automatch sweep loop runs (epic #72, #79). Heavier
  # than the wishlist loops -- a cycle can hold a user's beets write lock for real
  # work -- so it runs less often.
  poll_interval_s: 300
  # a user counts as "not idle" if Navidrome reports them playing something within
  # this many seconds ago (checked before the sweep starts, and again between
  # chunks so a user who starts listening mid-sweep isn't kept waiting).
  idle_recency_window_s: 600
  # tracks reimported per `beet import -L` invocation / write-lock acquisition, so
  # a foreground import never queues behind more than one chunk's worth of work.
  chunk_size: 5
  # wall-clock budget per user per cycle; any remaining chunks are deferred to the
  # next cycle rather than run unbounded.
  wall_clock_budget_s: 300
  # how many times a track that hit `error` (network/timeout/MB rate-limit, not a
  # confident no-match) is retried on later cycles before it's left alone.
  error_retry_cap: 5