---
app_env: dev
local_user_music_stem: music
zip_name: music
# Everything about *this host* that the per-user compose files need. pymix renders
# those files itself (pymix/templates/compose/) instead of reading them off a
# checkout of laker-93/subbox, which had one branch per machine.
host:
  # Absolute path, in the HOST's terms, of the directory mounted into pymix as
  # `pymix_mount`. Compose runs against the host daemon, so every bind source pymix
  # renders has to be translated from its own view into this one.
  bind_root: /Users/lukepurnell/workspace/subbox
  pymix_mount: /subbox
  uid: 501
  gid: 20
  timezone: Etc/UTC
  docker_network: proxy
  traefik:
    # navidrome{user}.<domain>
    domain: docker.localhost
    # unset => `tls=true`, i.e. traefik's local self-signed cert
    cert_resolver:
    cors_middleware: navcors
  navidrome:
    image: deluan/navidrome:0.60.3
    prometheus: false
    # Passthrough: emitted verbatim as ND_* env. Tuning knobs only -- the settings
    # pymix itself depends on are fixed in the template. This map is deliberately
    # NOT unified with prod: it reproduces what this host runs today, so Phase 2
    # moves where the file lives without also changing how Navidrome behaves.
    env:
      ND_LOGLEVEL: debug
      ND_SESSIONTIMEOUT: 24h
      ND_SCANSCHEDULE: 0
      ND_ENABLEINSIGHTSCOLLECTOR: false
      ND_COVERARTPRIORITY: embedded
  beets:
    image: lscr.io/linuxserver/beets:2.13.1
    env: {}

containers:
  subsonic:
    # Container-to-container over the shared docker network, same as prod. It used to
    # be host.docker.internal:{port} -- the port the compose file publishes -- which
    # cannot work for account creation: NavidromeClient.create_account hardcodes
    # port=4533 ("we're inside the same docker network"), so this formatted to
    # host.docker.internal:4533 and connection-refused. Another symptom of dev config
    # never having been loaded by a running pymix; see music_backup_path below.
    host: http://navidrome{user}:4533
    version: 1.16.1
    # Must track ND_MUSICFOLDER in the per-user navidrome compose template
    # (pymix/templates/compose/navidrome.yml.j2), which is
    # `/music/<user>` -- so Navidrome reports `/music/<user>/<artist>/...`
    # and the base to strip is `/music`. This read `/music/private`, which is not a
    # prefix of that, so removeprefix() no-opped and every track came back with the
    # stem prepended to an already-rooted path: `/music/music/<user>/...`. That broke
    # `pymix_path` (nothing at that path to read a duration or subbox_id from) and put
    # one `music` segment too many in every exported Rekordbox Location (#141).
    music_path_base_to_remove: /music
    serving_music_path_base: /private-music
    # ServicesOrchestrator.create() mkdirs this for every new user, so a config
    # without it cannot create one at all. Dev never had it because dev config was
    # never actually loaded: the local stack runs APP_ENVIRONMENT=prod, and the only
    # thing that made it a *dev* machine was the branch of the laker-93/subbox
    # checkout it mounted. Now that the host facts live in this file, dev has to be
    # the config this machine loads, so it has to be complete.
    music_backup_path: /private-music/backup/{user}
    metrics_path: /metrics
  filebrowser:
    user_root: /user-updownloads
    data_watch: /user-updownloads/{user}/watch
    data_uploads: /user-updownloads/{user}/uploads
    data_downloads: /user-updownloads/{user}/downloads
  beets:
    data: /private-staged/{user}/
    data_public: /public-staged
    config_file_dst: /subbox/users/{user}/beets/config/config.yaml
# Dev keeps console-only logging: `docker logs pymix` is right there, and a rotating file
# inside the container is litter nobody reads. See config.prod.yaml for why prod differs.
logs_directory: logs
disable_file_handler: true
memory_watch:
  # Sampled in dev too — the local stack is where a burst-allocating change gets written,
  # so it's the cheapest place to notice one. Slower than prod; nothing here is at risk.
  interval_s: 300
  warn_fraction: 0.8
user_root: /subbox/{user}
db:
  host: pymix-postgres
  port: 5432
max_number_of_users: 10
max_number_of_tracks: 1000
max_library_size: 10737418240 # 10GB
# number of seconds after which the export job will be updated with number of files written to zip during export job
update_job_period_s: 1
google_sheets:
  credentials_path: /subbox/secrets/google-sheets-service-account.json
  poll_interval_s: 300
  # hard cap on any single blocking Sheets HTTP call. Without it httplib2 blocks
  # forever on a half-open socket (laker-93/pymix#81).
  timeout_s: 30
wishlist:
  # how often the background loop re-checks open wishlist items against each
  # user's Navidrome library (catches tracks that only become queryable after
  # Navidrome finishes scanning a fresh import)
  reconcile_interval_s: 90
  # how often the background loop resolves pending free-text items (hand-typed
  # artist/title, or inbox raw notes) to a canonical MusicBrainz match, so a typo'd
  # entry is corrected before the downloader searches Soulseek for it. MusicBrainz
  # is rate-limited to ~1 req/s, so this is deliberately unhurried.
  resolve_interval_s: 60
  # Local dev runs from a residential IP that YouTube doesn't bot-challenge, so no
  # cookies are needed. Uncomment (and drop a cookies.txt at the path) only to
  # reproduce the prod cookie flow. See config.prod.yaml for details.
  # ytdlp_cookies_path: /subbox/secrets/ytdlp-cookies.txt
