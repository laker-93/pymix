---
app_env: prod
local_user_music_stem: music
zip_name: music
# See config.dev.yaml's `host:` block for what each key is for.
host:
  bind_root: /home/deploy/subbox
  pymix_mount: /subbox
  uid: 1000
  gid: 1000
  timezone: Etc/UTC
  docker_network: traefik
  traefik:
    domain: sub-box.net
    cert_resolver: le
    cors_middleware: cors
  navidrome:
    image: deluan/navidrome:0.60.3
    # The real on/off switch for the Grafana Cloud dashboard's scrape targets --
    # see ../subbox-workspace/docs/monitoring.md. It used to be hardcoded in the
    # droplet branch's compose file, which is why the pymix-side metrics_path
    # mechanism was documented as inert; it is not inert any more.
    prometheus: true
    # Reproduces exactly what the droplet branch's compose file sets today, no more.
    # Note it does NOT set ND_SCANSCHEDULE or ND_COVERARTPRIORITY, which dev does --
    # that difference is pre-existing and deliberately preserved here rather than
    # quietly unified as part of a move.
    env:
      ND_LOGLEVEL: debug
      ND_SESSIONTIMEOUT: 24h
  beets:
    image: lscr.io/linuxserver/beets:2.13.1
    env: {}

containers:
  subsonic:
    #host: http://localhost:4533/navidrome
    host: http://navidrome{user}:4533
    version: 1.161
    music_path_base_to_remove: /music
    serving_music_path_base: /private-music
    music_backup_path: /private-music/backup/{user}
    metrics_path: /metrics
  filebrowser:
    user_root: /user-updownloads
    data_watch: /user-updownloads/{user}/watch
    data_uploads: /user-updownloads/{user}/uploads
    data_downloads: /user-updownloads/{user}/downloads
  beets:
    data: /private-staged/{user}/
    data_public: /public-staged
    config_file_dst: /subbox/users/{user}/beets/config/config.yaml
# Durable log copy, on the /subbox host bind mount rather than inside the container, so
# it survives the `docker compose up -d` that a deploy or a mem_limit change performs —
# Docker's own json-file log does not (laker-93/pymix#125). Rotates at midnight, 10 days
# kept, INFO and above.
logs_directory: /subbox/logs
disable_file_handler: false
memory_watch:
  # How often to log an RSS/allocator/cgroup sample. The kernel SIGKILLs at the cgroup
  # limit with no warning and no traceback, so the only diagnosis that survives an OOM
  # kill is one already written to the log before it. 60s is cheap (three small procfs
  # reads and a libc struct copy) and fine-grained enough to show a ramp.
  interval_s: 60
  # Fraction of the container's memory limit at which samples escalate to WARNING.
  warn_fraction: 0.8
user_root: /subbox/{user}
db:
  host: pymix-postgres
  port: 5432
max_number_of_users: 10
max_number_of_tracks: 1000
max_library_size: 10737418240 # 10GB
# number of seconds after which the export job will be updated with number of files written to zip during export job
update_job_period_s: 2
subsonic:
  host: http:/localhost:4533
  username: lajp
  version: 1.16.1
google_sheets:
  credentials_path: /subbox/secrets/google-sheets-service-account.json
  poll_interval_s: 300
  # hard cap on any single blocking Sheets HTTP call. Without it httplib2 blocks
  # forever on a half-open socket (laker-93/pymix#81).
  timeout_s: 30
wishlist:
  # how often the background loop re-checks open wishlist items against each
  # user's Navidrome library (catches tracks that only become queryable after
  # Navidrome finishes scanning a fresh import)
  reconcile_interval_s: 90
  # how often the background loop resolves pending free-text items (hand-typed
  # artist/title, or inbox raw notes) to a canonical MusicBrainz match, so a typo'd
  # entry is corrected before the downloader searches Soulseek for it. MusicBrainz
  # is rate-limited to ~1 req/s, so this is deliberately unhurried.
  resolve_interval_s: 60
  # Netscape-format cookies.txt yt-dlp reads when resolving/searching pasted links.
  # Prod runs on a cloud droplet, whose datacenter IP YouTube blocks with a "confirm
  # you're not a bot" challenge unless the request carries authenticated cookies. One
  # file may also hold soundcloud.com / bandcamp.com cookies, so it covers every link
  # source. Export from a logged-in browser and drop it at this path (same /subbox/secrets
  # mount as the google-sheets cred). Missing file → parsing falls back to anonymous.
  ytdlp_cookies_path: /subbox/secrets/ytdlp-cookies.txt
